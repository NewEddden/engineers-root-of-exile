<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Engineer's Root of Exile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">The Engineer's Root of Exile</h1>
    </header>

    <main class="page-shell">
      <div class="mode-toggle" role="group" aria-label="Reading mode">
        <button
          type="button"
          class="mode-btn"
          data-mode="separate"
          aria-pressed="true"
        >
          Chapters separate
        </button>
        <button
          type="button"
          class="mode-btn"
          data-mode="all"
          aria-pressed="false"
        >
          All chapters
        </button>
      </div>

      <nav class="chapter-nav" aria-label="Chapter navigation, top">
        <button
          type="button"
          class="nav-btn prev-btn"
          aria-label="Previous chapter"
        >
          &larr; Prev
        </button>
        <select class="chapter-select" aria-label="Jump to chapter"></select>
        <button
          type="button"
          class="nav-btn next-btn"
          aria-label="Next chapter"
        >
          Next &rarr;
        </button>
      </nav>

      <article class="page">
        <svg class="rune-divider" viewBox="0 0 120 20" aria-hidden="true">
          <line
            x1="0"
            y1="10"
            x2="45"
            y2="10"
            stroke="currentColor"
            stroke-width="1"
          />
          <circle
            cx="60"
            cy="10"
            r="5"
            stroke="currentColor"
            stroke-width="1"
            fill="none"
          />
          <circle cx="60" cy="10" r="1.5" fill="currentColor" />
          <line
            x1="75"
            y1="10"
            x2="120"
            y2="10"
            stroke="currentColor"
            stroke-width="1"
          />
        </svg>
        <h2 id="chapter-title" class="chapter-title">Loading...</h2>
        <div id="chapter-content" class="chapter-content"></div>
      </article>

      <nav class="chapter-nav" aria-label="Chapter navigation, bottom">
        <button
          type="button"
          class="nav-btn prev-btn"
          aria-label="Previous chapter"
        >
          &larr; Prev
        </button>
        <select class="chapter-select" aria-label="Jump to chapter"></select>
        <button
          type="button"
          class="nav-btn next-btn"
          aria-label="Next chapter"
        >
          Next &rarr;
        </button>
      </nav>
    </main>

    <footer class="site-footer">
      <p>The Engineer's Root of Exile, an ongoing serial.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
